      <ellipse cx="297" cy="175" rx="11" ry="15"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="211" cy="169" r="4.5"/>
      <circle cx="293" cy="169" r="4.5"/>
      <circle cx="219" cy="182" r="2"/>
      <circle cx="301" cy="182" r="2"/>
    </g>
    <!-- brows -->
    <g fill="#FFFFFF" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round">
      <use href="#h-brow-l"/>
      <use href="#h-brow-r"/>
    </g>
    <!-- mouth -->
    <use href="#h-mouth" fill="#8E3B3B"/>
    <g clip-path="url(#h-mouth-c)">
      <ellipse cx="256" cy="280" rx="17" ry="9" fill="#F07F86"/>
    </g>
    <use href="#h-mouth" fill="none" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round"/>
    <!-- mustache -->
    <g clip-path="url(#h-mus-c)">
      <use href="#h-mus" fill="#DCE3EC"/>
      <use href="#h-mus" fill="#FFFFFF" transform="translate(-4 -7)"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-linecap="round" stroke-linejoin="round">
