      <path id="classic-coat-r" d="M328 292 C352 298 366 334 368 376 C370 412 378 440 376 458 L274 458 L256 418 L256 394 L286 304 C300 296 314 292 328 292 Z"/>
      <clipPath id="classic-coat-l-c"><use href="#classic-coat-l"/></clipPath>
      <clipPath id="classic-coat-r-c"><use href="#classic-coat-r"/></clipPath>
      <path id="classic-lapel-l" d="M226 304 L254 388 L230 356 L206 340 L214 322 L208 306 Z"/>
      <path id="classic-lapel-r" d="M286 304 L258 388 L282 356 L306 340 L298 322 L304 306 Z"/>
      <path id="classic-tie" d="M246 304 L266 304 L272 372 L256 392 L240 372 Z"/>
      <path id="classic-sleeve-l" d="M192 292 C168 296 142 312 116 332 C120 346 128 358 140 368 C154 358 168 350 182 346 C186 328 194 306 192 292 Z"/>
      <path id="classic-sleeve-r" d="M320 292 C344 296 370 312 396 332 C392 346 384 358 372 368 C358 358 344 350 330 346 C326 328 318 306 320 292 Z"/>
