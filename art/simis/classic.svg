    <g clip-path="url(#h-tuft-l-c)">
      <use href="#h-tuft-l" fill="#DCE3EC"/>
      <use href="#h-tuft-l" fill="#FFFFFF" transform="translate(-6 -8)"/>
    </g>
    <g clip-path="url(#h-tuft-r-c)">
      <use href="#h-tuft-r" fill="#DCE3EC"/>
      <use href="#h-tuft-r" fill="#FFFFFF" transform="translate(-6 -8)"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-linecap="round" stroke-linejoin="round">
      <use href="#h-tuft-l" stroke-width="6"/>
      <use href="#h-tuft-r" stroke-width="6"/>
      <path d="M120 176 C132 174 142 180 146 190" stroke-width="3.5"/>
      <path d="M122 222 C134 220 144 226 148 234" stroke-width="3.5"/>
      <path d="M392 176 C380 174 370 180 366 190" stroke-width="3.5"/>
      <path d="M390 222 C378 220 368 226 364 234" stroke-width="3.5"/>
    </g>
