      <circle cx="230" cy="386" r="6" fill="#9AA6B4" stroke-width="3"/>
      <circle cx="272" cy="367" r="6" fill="#C9D2DC" stroke-width="3.5"/>
      <circle cx="292" cy="369" r="6" fill="#C9D2DC" stroke-width="3.5"/>
