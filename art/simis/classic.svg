      <clipPath id="h-tuft-r-c"><use href="#h-tuft-r"/></clipPath>
      <path id="h-brow-l" d="M188 146 C190 130 210 124 228 130 C238 134 242 142 236 148 C226 142 208 142 196 150 C192 152 188 150 188 146 Z"/>
      <path id="h-brow-r" d="M324 146 C322 130 302 124 284 130 C274 134 270 142 276 148 C286 142 304 142 316 150 C320 152 324 150 324 146 Z"/>
      <path id="h-mouth" d="M228 246 C230 288 282 288 284 246 Z"/>
      <clipPath id="h-mouth-c"><use href="#h-mouth"/></clipPath>
      <path id="h-mus" d="M256 214 C236 200 200 200 182 214 C168 224 162 242 166 260 C176 264 186 260 190 252 C198 262 214 262 222 252 C232 262 248 258 256 248 C264 258 280 262 290 252 C298 262 314 262 322 252 C326 260 336 264 346 260 C350 242 344 224 330 214 C312 200 276 200 256 214 Z"/>
      <clipPath id="h-mus-c"><use href="#h-mus"/></clipPath>
      <ellipse id="h-nose" cx="256" cy="208" rx="23" ry="19"/>
      <clipPath id="h-nose-c"><use href="#h-nose"/></clipPath>
    </defs>
