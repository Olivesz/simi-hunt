      <rect x="192" y="410" width="44" height="52" rx="12"/>
      <rect x="276" y="410" width="44" height="52" rx="12"/>
    </g>
    <!-- shirt -->
    <g clip-path="url(#b-torso-c)">
      <use href="#b-torso" fill="#A9C6E6"/>
      <use href="#b-torso" fill="#CFE2F5" transform="translate(-8 -6)"/>
    </g>
    <!-- tie -->
    <use href="#classic-tie" fill="#1C4889" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round"/>
    <path d="M262 312 L266 366 L256 380" fill="none" stroke="#14325F" stroke-width="5" stroke-linecap="round"/>
    <!-- coat -->
    <g clip-path="url(#classic-coat-l-c)">
