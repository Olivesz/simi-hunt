      <rect x="182" y="390" width="10" height="26" rx="4" fill="#0798E8"/>
    </g>
    <path d="M176 388 L176 400 M190 394 L190 404" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M160 404 L210 404 L208 432 C196 436 176 436 162 432 Z" fill="#FFFFFF" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round"/>
    <path d="M164 414 L206 414" stroke="#DCE3EC" stroke-width="4" stroke-linecap="round"/>
    <rect x="300" y="350" width="30" height="20" rx="5" fill="#024EA2" stroke="#3B2A24" stroke-width="4"/>
