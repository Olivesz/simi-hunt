    <g fill="#F6C9A4" stroke="#3B2A24" stroke-width="5">
      <use href="#h-ear-l"/>
      <use href="#h-ear-r"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-width="3.5" stroke-linecap="round">
      <path d="M140 234 C132 238 132 250 140 254"/>
      <path d="M372 234 C380 238 380 250 372 254"/>
    </g>
    <!-- skull -->
    <g clip-path="url(#h-skull-c)">
      <use href="#h-skull" fill="#E3A982"/>
      <use href="#h-skull" fill="#F6C9A4" transform="translate(-12 -12)"/>
