<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Simi Hunt: classic. Rig and palette: art/STYLE.md. -->

  <g id="shadow">
    <ellipse cx="256" cy="492" rx="120" ry="14" fill="#3B2A24" opacity="0.2"/>
  </g>

  <g id="sticker" fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
    <!-- head pieces: copy verbatim -->
    <use href="#h-skull" stroke-width="28"/>
    <use href="#h-tuft-l" stroke-width="28"/>
    <use href="#h-tuft-r" stroke-width="28"/>
    <use href="#h-ear-l" stroke-width="28"/>
    <use href="#h-ear-r" stroke-width="28"/>
    <use href="#classic-coat-l" stroke-width="28"/>
    <use href="#classic-coat-r" stroke-width="28"/>
    <use href="#classic-sleeve-l" stroke-width="28"/>
    <use href="#classic-sleeve-r" stroke-width="28"/>
    <use href="#b-hand-l" stroke-width="28"/>
    <use href="#b-hand-r" stroke-width="28"/>
    <use href="#b-shoe-l" stroke-width="28"/>
    <use href="#b-shoe-r" stroke-width="28"/>
  </g>

  <g id="outfit-back"></g>

