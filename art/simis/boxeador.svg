    <defs>
      <path id="boxeador-strap" d="M118 382 C176 394 336 394 394 382"/>
      <ellipse id="boxeador-plate" cx="256" cy="390" rx="58" ry="46"/>
      <clipPath id="boxeador-plate-c"><use href="#boxeador-plate"/></clipPath>
      <linearGradient id="boxeador-gold-g" gradientUnits="userSpaceOnUse" x1="214" y1="348" x2="296" y2="430">
        <stop offset="0" stop-color="#FFE07A"/>
        <stop offset="0.45" stop-color="#F6B81F"/>
        <stop offset="1" stop-color="#E9A514"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke-linecap="round">
      <use href="#boxeador-strap" stroke="#3B2A24" stroke-width="44"/>
      <use href="#boxeador-strap" stroke="#4A3530" stroke-width="34"/>
      <use href="#boxeador-strap" stroke="#F6B81F" stroke-width="2.5" stroke-dasharray="5 6" transform="translate(0 -11)"/>
      <use href="#boxeador-strap" stroke="#F6B81F" stroke-width="2.5" stroke-dasharray="5 6" transform="translate(0 11)"/>
    </g>
    <!-- side plates -->
    <g stroke="#3B2A24" stroke-width="4" stroke-linejoin="round">
      <rect x="164" y="372" width="30" height="36" rx="7" fill="#F6B81F" transform="rotate(8 179 390)"/>
      <rect x="318" y="372" width="30" height="36" rx="7" fill="#F6B81F" transform="rotate(-8 333 390)"/>
    </g>
    <!-- center plate -->
    <g clip-path="url(#boxeador-plate-c)">
