      <use href="#boxeador-plate" fill="url(#boxeador-gold-g)" transform="translate(-5 -6)"/>
    </g>
    <use href="#boxeador-plate" fill="none" stroke="#3B2A24" stroke-width="5"/>
    <g transform="translate(0 -10)">
    <g fill="#FFE38A">
      <circle cx="210" cy="400" r="4"/><circle cx="302" cy="400" r="4"/>
      <circle cx="256" cy="360" r="4"/><circle cx="256" cy="440" r="4"/>
      <circle cx="223" cy="372" r="3.5"/><circle cx="289" cy="372" r="3.5"/>
      <circle cx="223" cy="428" r="3.5"/><circle cx="289" cy="428" r="3.5"/>
    </g>
    <circle cx="256" cy="400" r="31" fill="#024EA2" stroke="#3B2A24" stroke-width="4"/>
    <path d="M256.0 376.0 L261.6 390.3 L276.9 391.2 L265.0 400.9 L268.9 415.8 L256.0 407.5 L243.1 415.8 L247.0 400.9 L235.1 391.2 L250.4 390.3 Z" transform="translate(0 2)" fill="#FFFFFF" stroke="#3B2A24" stroke-width="3.5" stroke-linejoin="round"/>
    </g>
    <!-- gloves back on top of the strap ends -->
    <use href="#boxeador-gloves"/>
