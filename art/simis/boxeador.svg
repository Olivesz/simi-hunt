    <path d="M198 300 C210 314 224 326 240 334" fill="none" stroke="#FFE38A" stroke-width="4" stroke-linecap="round"/>
    <g fill="none" stroke="#3B2A24" stroke-linecap="round" stroke-linejoin="round">
