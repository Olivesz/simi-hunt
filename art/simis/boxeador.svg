      <use href="#h-skull" fill="#F6C9A4" transform="translate(-12 -12)"/>
    </g>
    <ellipse cx="206" cy="112" rx="26" ry="12" transform="rotate(-30 206 112)" fill="#FCE3CE"/>
    <circle cx="240" cy="92" r="6" fill="#FCE3CE"/>
    <use href="#h-skull" fill="none" stroke="#3B2A24" stroke-width="6"/>
    <!-- cheeks -->
    <g fill="#F59A9A">
      <ellipse cx="184" cy="208" rx="18" ry="11"/>
      <ellipse cx="328" cy="208" rx="18" ry="11"/>
    </g>
    <!-- eyes -->
    <g fill="#3B2A24">
      <ellipse cx="215" cy="175" rx="11" ry="15"/>
      <ellipse cx="297" cy="175" rx="11" ry="15"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="211" cy="169" r="4.5"/>
      <circle cx="293" cy="169" r="4.5"/>
      <circle cx="219" cy="182" r="2"/>
      <circle cx="301" cy="182" r="2"/>
    </g>
    <!-- brows -->
    <g fill="#FFFFFF" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round">
      <use href="#h-brow-l"/>
      <use href="#h-brow-r"/>
    </g>
    <!-- mouth -->
    <use href="#h-mouth" fill="#8E3B3B"/>
    <g clip-path="url(#h-mouth-c)">
      <ellipse cx="256" cy="280" rx="17" ry="9" fill="#F07F86"/>
    </g>
    <use href="#h-mouth" fill="none" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round"/>
    <!-- mustache -->
    <g clip-path="url(#h-mus-c)">
      <use href="#h-mus" fill="#DCE3EC"/>
      <use href="#h-mus" fill="#FFFFFF" transform="translate(-4 -7)"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-linecap="round" stroke-linejoin="round">
      <use href="#h-mus" stroke-width="5"/>
      <path d="M196 232 C206 240 220 240 230 234" stroke-width="3.5"/>
      <path d="M316 232 C306 240 292 240 282 234" stroke-width="3.5"/>
      <path d="M256 232 L256 246" stroke-width="3.5"/>
    </g>
    <!-- nose -->
    <g clip-path="url(#h-nose-c)">
      <use href="#h-nose" fill="#E3A982"/>
      <use href="#h-nose" fill="#F6C9A4" transform="translate(-4 -5)"/>
