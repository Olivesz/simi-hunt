      <path id="boxeador-sleeve-l" d="M198 298 C166 298 140 318 120 346 C128 360 140 370 154 376 C166 358 182 346 204 340 Z"/>
      <path id="boxeador-sleeve-r" d="M314 298 C346 298 372 318 392 346 C384 360 372 370 358 376 C346 358 330 346 308 340 Z"/>
      <path id="boxeador-cuff-l" d="M120 346 C128 360 140 370 154 376 L162 362 C150 356 140 346 132 334 Z"/>
      <path id="boxeador-cuff-r" d="M392 346 C384 360 372 370 358 376 L350 362 C362 356 372 346 380 334 Z"/>
      <path id="boxeador-lapel-l" d="M186 294 C204 314 226 332 254 346 L256 326 C238 316 226 304 218 288 Z"/>
      <path id="boxeador-lapel-r" d="M326 294 C308 314 286 332 258 346 L256 326 C274 316 286 304 294 288 Z"/>
      <!-- glove parts, local space: cuff up, fist down -->
      <rect id="boxeador-gl-cuff" x="-22" y="-56" width="44" height="30" rx="10"/>
      <path id="boxeador-gl-fist" d="M-24 -32 C-42 -30 -48 -2 -42 20 C-34 44 -8 52 14 46 C38 38 46 12 40 -12 C36 -28 22 -36 4 -36 C-6 -36 -16 -35 -24 -32 Z"/>
      <path id="boxeador-gl-thumb" d="M14 -20 C32 -24 44 -6 41 12 C39 24 28 28 20 20 C12 12 8 -12 14 -20 Z"/>
      <clipPath id="boxeador-gl-fist-c"><use href="#boxeador-gl-fist"/></clipPath>
      <clipPath id="boxeador-gl-thumb-c"><use href="#boxeador-gl-thumb"/></clipPath>
      <g id="boxeador-glove-l" transform="translate(110 390) rotate(30)">
