    <g fill="none" stroke="#3B2A24" stroke-linecap="round" stroke-linejoin="round">
      <use href="#h-tuft-l" stroke-width="6"/>
      <use href="#h-tuft-r" stroke-width="6"/>
      <path d="M120 176 C132 174 142 180 146 190" stroke-width="3.5"/>
      <path d="M122 222 C134 220 144 226 148 234" stroke-width="3.5"/>
      <path d="M392 176 C380 174 370 180 366 190" stroke-width="3.5"/>
      <path d="M390 222 C378 220 368 226 364 234" stroke-width="3.5"/>
    </g>
  </g>

  <g id="outfit-head">
    <!-- a pharmacy bandage from the last round -->
    <g transform="rotate(-30 318 112)" stroke="#3B2A24" stroke-linejoin="round">
      <rect x="292" y="102" width="52" height="20" rx="10" fill="#F2D2AE" stroke-width="4"/>
      <rect x="308" y="104" width="20" height="16" rx="3" fill="#FFF4E6" stroke-width="2.5"/>
      <g fill="#C9A27C" stroke="none">
        <circle cx="299" cy="109" r="1.6"/><circle cx="299" cy="115" r="1.6"/>
        <circle cx="337" cy="109" r="1.6"/><circle cx="337" cy="115" r="1.6"/>
      </g>
    </g>
    <g transform="rotate(40 318 112)" stroke="#3B2A24" stroke-linejoin="round">
      <rect x="296" y="104" width="44" height="17" rx="8.5" fill="#F2D2AE" stroke-width="4"/>
      <rect x="310" y="106" width="16" height="13" rx="3" fill="#FFF4E6" stroke-width="2.5"/>
    </g>
  </g>

  <g id="prop">
