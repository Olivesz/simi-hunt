      <path id="b-arm-l" d="M182 314 C164 326 140 346 124 370"/>
      <path id="b-arm-r" d="M330 314 C348 326 372 346 388 370"/>
      <circle id="b-hand-l" cx="118" cy="382" r="22"/>
      <circle id="b-hand-r" cx="394" cy="382" r="22"/>
      <clipPath id="b-hand-l-c"><use href="#b-hand-l"/></clipPath>
      <clipPath id="b-hand-r-c"><use href="#b-hand-r"/></clipPath>
      <rect id="b-leg-l" x="194" y="418" width="38" height="46" rx="16"/>
      <rect id="b-leg-r" x="280" y="418" width="38" height="46" rx="16"/>
      <ellipse id="b-shoe-l" cx="211" cy="469" rx="27" ry="18"/>
      <ellipse id="b-shoe-r" cx="301" cy="469" rx="27" ry="18"/>
    </defs>
    <!-- arms: dark stroke under a skin stroke = outlined limb -->
    <g fill="none" stroke-linecap="round">
      <use href="#b-arm-l" stroke="#3B2A24" stroke-width="50"/>
      <use href="#b-arm-r" stroke="#3B2A24" stroke-width="50"/>
      <use href="#b-arm-l" stroke="#E3A982" stroke-width="40"/>
      <use href="#b-arm-r" stroke="#E3A982" stroke-width="40"/>
      <use href="#b-arm-l" stroke="#F6C9A4" stroke-width="26" transform="translate(-3 -5)"/>
      <use href="#b-arm-r" stroke="#F6C9A4" stroke-width="26" transform="translate(-3 -5)"/>
    </g>
    <!-- legs -->
    <g fill="#F6C9A4" stroke="#3B2A24" stroke-width="5">
      <use href="#b-leg-l"/>
      <use href="#b-leg-r"/>
    </g>
    <!-- hands: mitten with thumb -->
    <g clip-path="url(#b-hand-l-c)">
      <use href="#b-hand-l" fill="#E3A982"/>
      <use href="#b-hand-l" fill="#F6C9A4" transform="translate(-5 -6)"/>
