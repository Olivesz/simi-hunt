        </g>
        <ellipse cx="-22" cy="-10" rx="7" ry="12" transform="rotate(20 -22 -10)" fill="#F2708A"/>
        <path d="M-30 -24 C-24 -28 -10 -30 2 -28" fill="none" stroke="#7A0820" stroke-width="3" stroke-linecap="round"/>
        <use href="#boxeador-gl-fist" fill="none" stroke="#3B2A24" stroke-width="6"/>
        <g clip-path="url(#boxeador-gl-thumb-c)">
          <use href="#boxeador-gl-thumb" fill="#A30B2E"/>
          <use href="#boxeador-gl-thumb" fill="#D60F3C" transform="translate(-7 -3)"/>
        </g>
        <use href="#boxeador-gl-thumb" fill="none" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <g transform="translate(402 390) scale(-1 1) rotate(30)">
