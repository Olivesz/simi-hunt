      </g>
      <g id="boxeador-glove-r" transform="translate(402 390) scale(-1 1) rotate(30)">
        <use href="#boxeador-gl-cuff"/><use href="#boxeador-gl-fist"/><use href="#boxeador-gl-thumb"/>
      </g>
    </defs>

    <!-- robe: Similares-blue satin, shawl collar -->
    <g clip-path="url(#b-torso-c)">
      <use href="#b-torso" fill="#1C4889"/>
      <use href="#b-torso" fill="#024EA2" transform="translate(-12 -8)"/>
      <path d="M218 284 L256 330 L294 284 Z" fill="#F6C9A4"/>
      <path d="M236 296 L256 320 L276 296 Z" fill="#EDB993"/>
      <path d="M150 372 C152 346 164 326 186 312" fill="none" stroke="#4A8BDA" stroke-width="12" stroke-linecap="round"/>
      <path d="M146 396 L146 388" fill="none" stroke="#4A8BDA" stroke-width="10" stroke-linecap="round"/>
      <path d="M318 318 C328 324 336 332 340 342" fill="none" stroke="#4A8BDA" stroke-width="8" stroke-linecap="round"/>
    </g>
    <g fill="#F6B81F" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round">
