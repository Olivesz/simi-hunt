  <g id="fx">
    <g fill="#FFE38A" stroke="#3B2A24" stroke-width="3" stroke-linejoin="round">
      <path d="M62 282 Q64 296 78 298 Q64 300 62 314 Q60 300 46 298 Q60 296 62 282 Z"/>
      <path d="M452 290 Q454 302 466 304 Q454 306 452 318 Q450 306 438 304 Q450 302 452 290 Z"/>
    </g>
    <path d="M220 370 Q221 376 227 377 Q221 378 220 384 Q219 378 213 377 Q219 376 220 370 Z" fill="#FFFFFF"/>

  </g>
</svg>
