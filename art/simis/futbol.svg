    <use href="#b-arm-r" fill="none" stroke-width="72"/>
    <use href="#b-hand-l" stroke-width="28"/>
    <use href="#b-hand-r" stroke-width="28"/>
    <use href="#b-shoe-l" stroke-width="28"/>
    <use href="#b-shoe-r" stroke-width="28"/>
    <!-- outfit and prop pieces -->
    <use href="#futbol-sleeve-l" fill="none" stroke-width="76"/>
    <use href="#futbol-sleeve-r" fill="none" stroke-width="76"/>
    <use href="#futbol-cleat-l" stroke-width="28"/>
