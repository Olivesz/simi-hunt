<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <title>Futbolista Simi</title>
  <!-- Futbolista Simi (common, hydration and electrolytes).
       Read at 48 px: Similares-blue jersey with a white 10, white shorts, lime cleats, and a ball balanced on the bald dome.
       Pose: a head stall. Both arms re-posed for balance, left up and out, right down and out.
       Expression: star glints over the eye highlights (excited). The smile stays.
       Story: a generic kit with no crest (white V-neck, light-blue side panels, subtle tonal stripes), the playmaker's 10 drawn as shapes with a light-blue drop shadow, studded cleats, wobble lines and sparkles around the ball.
       Colors: jersey #024EA2/#1C4889, tonal stripes #0A58AE, accent #0798E8, shorts #FFFFFF/#DCE3EC, cleats #C8E62E/#9DB81E, sparkles #FFD84D.
       Head anchors used: ball resting on the skull top (y 72), centered (262, 60), r 34; glints on the eye highlights at (211, 168) and (293, 168).
       Head copied verbatim from art/base/simi-base.svg; body copied from the base, re-posed only where noted. -->

