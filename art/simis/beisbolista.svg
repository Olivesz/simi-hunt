    <ellipse cx="206" cy="112" rx="26" ry="12" transform="rotate(-30 206 112)" fill="#FCE3CE"/>
    <circle cx="240" cy="92" r="6" fill="#FCE3CE"/>
    <use href="#h-skull" fill="none" stroke="#3B2A24" stroke-width="6"/>
    <!-- cheeks -->
