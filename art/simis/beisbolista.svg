      <use href="#beisbolista-mitt-shape" fill="none" stroke="#3B2A24" stroke-width="6" stroke-linejoin="round"/>
      <g fill="none" stroke="#3B2A24" stroke-width="3.5" stroke-linecap="round">
        <path d="M-27 -32 L-27 -16"/>
        <path d="M-10 -36 L-10 -20"/>
        <path d="M7 -36 L7 -20"/>
