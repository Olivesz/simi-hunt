      <path d="M388 368 C382 372 380 380 384 386" stroke-width="4"/>
      <path d="M400 372 C406 374 410 378 412 384" stroke-width="3"/>
      <path d="M398 382 C404 384 408 388 409 393" stroke-width="3"/>
