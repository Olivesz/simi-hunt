      </g>
      <use href="#beisbolista-bat-shape" fill="none" stroke="#3B2A24" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-5 -60 L5 -66 M-5 -48 L5 -54" stroke="#3B2A24" stroke-width="2.5" fill="none"/>
