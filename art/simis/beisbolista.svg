      <circle cx="246" cy="356" r="4.5"/>
      <circle cx="246" cy="382" r="4.5"/>
    </g>
    <!-- chest number -->
    <path d="M286 330 L320 330 L320 339 L304 372 L292 372 L307 340 L286 340 Z" fill="#D60F3C" stroke="#3B2A24" stroke-width="3.5" stroke-linejoin="round"/>
