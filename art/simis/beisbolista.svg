      <rect x="110" y="404" width="280" height="60" fill="#E4E9F0" transform="translate(-6 -4)"/>
      <!-- placket piping -->
      <rect x="259" y="290" width="7" height="112" fill="#024EA2"/>
      <!-- side piping on pants -->
      <rect x="150" y="404" width="8" height="50" fill="#024EA2"/>
      <rect x="354" y="404" width="8" height="50" fill="#024EA2"/>
      <!-- belt -->
      <rect x="120" y="394" width="280" height="14" fill="#024EA2"/>
