<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <!-- Simi Hunt canonical base. Rig and palette: art/STYLE.md. -->

  <g id="shadow">
    <ellipse cx="256" cy="492" rx="120" ry="14" fill="#3B2A24" opacity="0.2"/>
  </g>

  <!-- White die-cut border. One white use per silhouette piece. -->
  <g id="sticker" fill="#FFFFFF" stroke="#FFFFFF" stroke-linejoin="round" stroke-linecap="round">
    <!-- head pieces: copy verbatim -->
    <use href="#h-skull" stroke-width="28"/>
    <use href="#h-tuft-l" stroke-width="28"/>
    <use href="#h-tuft-r" stroke-width="28"/>
    <use href="#h-ear-l" stroke-width="28"/>
    <use href="#h-ear-r" stroke-width="28"/>
    <!-- body pieces -->
    <use href="#b-torso" stroke-width="28"/>
    <use href="#b-arm-l" fill="none" stroke-width="72"/>
    <use href="#b-arm-r" fill="none" stroke-width="72"/>
    <use href="#b-hand-l" stroke-width="28"/>
    <use href="#b-hand-r" stroke-width="28"/>
    <use href="#b-shoe-l" stroke-width="28"/>
    <use href="#b-shoe-r" stroke-width="28"/>
  </g>

  <g id="outfit-back"></g>

  <g id="body">
    <defs>
      <path id="b-torso" d="M184 292 C160 298 148 334 146 376 C144 420 160 446 196 448 L316 448 C352 446 368 420 366 376 C364 334 352 298 328 292 C304 286 208 286 184 292 Z"/>
      <clipPath id="b-torso-c"><use href="#b-torso"/></clipPath>
      <path id="b-arm-l" d="M182 314 C164 326 140 346 124 370"/>
      <path id="b-arm-r" d="M330 314 C348 326 372 346 388 370"/>
      <circle id="b-hand-l" cx="118" cy="382" r="22"/>
      <circle id="b-hand-r" cx="394" cy="382" r="22"/>
      <clipPath id="b-hand-l-c"><use href="#b-hand-l"/></clipPath>
      <clipPath id="b-hand-r-c"><use href="#b-hand-r"/></clipPath>
      <rect id="b-leg-l" x="194" y="418" width="38" height="46" rx="16"/>
      <rect id="b-leg-r" x="280" y="418" width="38" height="46" rx="16"/>
      <ellipse id="b-shoe-l" cx="211" cy="469" rx="27" ry="18"/>
      <ellipse id="b-shoe-r" cx="301" cy="469" rx="27" ry="18"/>
    </defs>
    <!-- arms: dark stroke under a skin stroke = outlined limb -->
    <g fill="none" stroke-linecap="round">
      <use href="#b-arm-l" stroke="#3B2A24" stroke-width="50"/>
      <use href="#b-arm-r" stroke="#3B2A24" stroke-width="50"/>
      <use href="#b-arm-l" stroke="#E3A982" stroke-width="40"/>
      <use href="#b-arm-r" stroke="#E3A982" stroke-width="40"/>
      <use href="#b-arm-l" stroke="#F6C9A4" stroke-width="26" transform="translate(-3 -5)"/>
      <use href="#b-arm-r" stroke="#F6C9A4" stroke-width="26" transform="translate(-3 -5)"/>
    </g>
    <!-- legs -->
    <g fill="#F6C9A4" stroke="#3B2A24" stroke-width="5">
      <use href="#b-leg-l"/>
      <use href="#b-leg-r"/>
    </g>
    <!-- hands: mitten with thumb -->
    <g clip-path="url(#b-hand-l-c)">
      <use href="#b-hand-l" fill="#E3A982"/>
      <use href="#b-hand-l" fill="#F6C9A4" transform="translate(-5 -6)"/>
    </g>
    <g clip-path="url(#b-hand-r-c)">
      <use href="#b-hand-r" fill="#E3A982"/>
      <use href="#b-hand-r" fill="#F6C9A4" transform="translate(-5 -6)"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-width="5" stroke-linecap="round">
      <use href="#b-hand-l"/>
      <use href="#b-hand-r"/>
      <path d="M124 368 C130 372 132 380 128 386" stroke-width="4"/>
      <path d="M388 368 C382 372 380 380 384 386" stroke-width="4"/>
    </g>
  </g>

  <g id="outfit-body">
    <!-- placeholder: plain undershirt, slacks, shoes -->
    <defs>
      <path id="base-sleeve-l" d="M208 290 C180 286 152 296 136 316 C146 330 160 346 176 356 C184 344 196 336 208 330 Z"/>
      <clipPath id="base-sleeve-l-c"><use href="#base-sleeve-l"/></clipPath>
      <path id="base-sleeve-r" d="M304 290 C332 286 360 296 376 316 C366 330 352 346 336 356 C328 344 316 336 304 330 Z"/>
      <clipPath id="base-sleeve-r-c"><use href="#base-sleeve-r"/></clipPath>
    </defs>
    <!-- pant legs -->
    <g fill="#7C8798" stroke="#3B2A24" stroke-width="5">
      <rect x="190" y="420" width="46" height="40" rx="12"/>
      <rect x="276" y="420" width="46" height="40" rx="12"/>
    </g>
    <!-- shirt + pants share the torso silhouette -->
    <g clip-path="url(#b-torso-c)">
      <use href="#b-torso" fill="#CDD6E2"/>
      <use href="#b-torso" fill="#EEF2F7" transform="translate(-12 -8)"/>
      <rect x="120" y="402" width="280" height="60" fill="#636D7D"/>
      <rect x="110" y="402" width="280" height="60" fill="#7C8798" transform="translate(-6 -4)"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M146 402 L366 402" stroke-width="4"/>
      <path d="M256 402 L256 444" stroke-width="4"/>
      <use href="#b-torso" stroke-width="6"/>
    </g>
    <!-- short sleeves -->
    <g clip-path="url(#base-sleeve-l-c)">
      <use href="#base-sleeve-l" fill="#CDD6E2"/>
      <use href="#base-sleeve-l" fill="#EEF2F7" transform="translate(-4 -7)"/>
    </g>
    <g clip-path="url(#base-sleeve-r-c)">
      <use href="#base-sleeve-r" fill="#CDD6E2"/>
      <use href="#base-sleeve-r" fill="#EEF2F7" transform="translate(-4 -7)"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-width="5" stroke-linejoin="round">
      <use href="#base-sleeve-l"/>
      <use href="#base-sleeve-r"/>
    </g>
    <!-- shoes -->
    <g fill="#6B4A3A" stroke="#3B2A24" stroke-width="5">
      <use href="#b-shoe-l"/>
      <use href="#b-shoe-r"/>
    </g>
    <g fill="#8F6A55">
      <ellipse cx="200" cy="461" rx="10" ry="5"/>
      <ellipse cx="290" cy="461" rx="10" ry="5"/>
    </g>
  </g>

  <g id="head">
    <defs>
      <path id="h-skull" d="M256 72 C322 72 374 124 374 190 C374 260 322 306 256 306 C190 306 138 260 138 190 C138 124 190 72 256 72 Z"/>
      <clipPath id="h-skull-c"><use href="#h-skull"/></clipPath>
      <ellipse id="h-ear-l" cx="138" cy="242" rx="15" ry="19"/>
      <ellipse id="h-ear-r" cx="374" cy="242" rx="15" ry="19"/>
      <path id="h-tuft-l" d="M176 136 C154 120 116 124 100 146 C110 148 116 152 118 158 C98 164 86 182 86 200 C96 196 106 198 112 204 C100 216 98 234 104 246 C118 236 136 242 150 248 C164 230 170 214 168 196 C170 176 182 158 176 136 Z"/>
      <path id="h-tuft-r" d="M336 136 C358 120 396 124 412 146 C402 148 396 152 394 158 C414 164 426 182 426 200 C416 196 406 198 400 204 C412 216 414 234 408 246 C394 236 376 242 362 248 C348 230 342 214 344 196 C342 176 330 158 336 136 Z"/>
      <clipPath id="h-tuft-l-c"><use href="#h-tuft-l"/></clipPath>
      <clipPath id="h-tuft-r-c"><use href="#h-tuft-r"/></clipPath>
      <path id="h-brow-l" d="M188 146 C190 130 210 124 228 130 C238 134 242 142 236 148 C226 142 208 142 196 150 C192 152 188 150 188 146 Z"/>
      <path id="h-brow-r" d="M324 146 C322 130 302 124 284 130 C274 134 270 142 276 148 C286 142 304 142 316 150 C320 152 324 150 324 146 Z"/>
      <path id="h-mouth" d="M228 246 C230 288 282 288 284 246 Z"/>
      <clipPath id="h-mouth-c"><use href="#h-mouth"/></clipPath>
      <path id="h-mus" d="M256 214 C236 200 200 200 182 214 C168 224 162 242 166 260 C176 264 186 260 190 252 C198 262 214 262 222 252 C232 262 248 258 256 248 C264 258 280 262 290 252 C298 262 314 262 322 252 C326 260 336 264 346 260 C350 242 344 224 330 214 C312 200 276 200 256 214 Z"/>
      <clipPath id="h-mus-c"><use href="#h-mus"/></clipPath>
      <ellipse id="h-nose" cx="256" cy="208" rx="23" ry="19"/>
      <clipPath id="h-nose-c"><use href="#h-nose"/></clipPath>
    </defs>
    <!-- ears -->
    <g fill="#F6C9A4" stroke="#3B2A24" stroke-width="5">
      <use href="#h-ear-l"/>
      <use href="#h-ear-r"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-width="3.5" stroke-linecap="round">
      <path d="M140 234 C132 238 132 250 140 254"/>
      <path d="M372 234 C380 238 380 250 372 254"/>
    </g>
    <!-- skull -->
    <g clip-path="url(#h-skull-c)">
      <use href="#h-skull" fill="#E3A982"/>
      <use href="#h-skull" fill="#F6C9A4" transform="translate(-12 -12)"/>
    </g>
    <ellipse cx="206" cy="112" rx="26" ry="12" transform="rotate(-30 206 112)" fill="#FCE3CE"/>
    <circle cx="240" cy="92" r="6" fill="#FCE3CE"/>
    <use href="#h-skull" fill="none" stroke="#3B2A24" stroke-width="6"/>
    <!-- cheeks -->
    <g fill="#F59A9A">
      <ellipse cx="184" cy="208" rx="18" ry="11"/>
      <ellipse cx="328" cy="208" rx="18" ry="11"/>
    </g>
    <!-- eyes -->
    <g fill="#3B2A24">
      <ellipse cx="215" cy="175" rx="11" ry="15"/>
      <ellipse cx="297" cy="175" rx="11" ry="15"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="211" cy="169" r="4.5"/>
      <circle cx="293" cy="169" r="4.5"/>
      <circle cx="219" cy="182" r="2"/>
      <circle cx="301" cy="182" r="2"/>
    </g>
    <!-- brows -->
    <g fill="#FFFFFF" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round">
      <use href="#h-brow-l"/>
      <use href="#h-brow-r"/>
    </g>
    <!-- mouth -->
    <use href="#h-mouth" fill="#8E3B3B"/>
    <g clip-path="url(#h-mouth-c)">
      <ellipse cx="256" cy="280" rx="17" ry="9" fill="#F07F86"/>
    </g>
    <use href="#h-mouth" fill="none" stroke="#3B2A24" stroke-width="4" stroke-linejoin="round"/>
    <!-- mustache -->
    <g clip-path="url(#h-mus-c)">
      <use href="#h-mus" fill="#DCE3EC"/>
      <use href="#h-mus" fill="#FFFFFF" transform="translate(-4 -7)"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-linecap="round" stroke-linejoin="round">
      <use href="#h-mus" stroke-width="5"/>
      <path d="M196 232 C206 240 220 240 230 234" stroke-width="3.5"/>
      <path d="M316 232 C306 240 292 240 282 234" stroke-width="3.5"/>
      <path d="M256 232 L256 246" stroke-width="3.5"/>
    </g>
    <!-- nose -->
    <g clip-path="url(#h-nose-c)">
      <use href="#h-nose" fill="#E3A982"/>
      <use href="#h-nose" fill="#F6C9A4" transform="translate(-4 -5)"/>
    </g>
    <ellipse cx="248" cy="200" rx="7" ry="4.5" fill="#FFF1E4"/>
    <use href="#h-nose" fill="none" stroke="#3B2A24" stroke-width="4"/>
    <!-- side hair -->
    <g clip-path="url(#h-tuft-l-c)">
      <use href="#h-tuft-l" fill="#DCE3EC"/>
      <use href="#h-tuft-l" fill="#FFFFFF" transform="translate(-6 -8)"/>
    </g>
    <g clip-path="url(#h-tuft-r-c)">
      <use href="#h-tuft-r" fill="#DCE3EC"/>
      <use href="#h-tuft-r" fill="#FFFFFF" transform="translate(-6 -8)"/>
    </g>
    <g fill="none" stroke="#3B2A24" stroke-linecap="round" stroke-linejoin="round">
      <use href="#h-tuft-l" stroke-width="6"/>
      <use href="#h-tuft-r" stroke-width="6"/>
      <path d="M120 176 C132 174 142 180 146 190" stroke-width="3.5"/>
      <path d="M122 222 C134 220 144 226 148 234" stroke-width="3.5"/>
      <path d="M392 176 C380 174 370 180 366 190" stroke-width="3.5"/>
      <path d="M390 222 C378 220 368 226 364 234" stroke-width="3.5"/>
    </g>
  </g>

  <g id="outfit-head"></g>
  <g id="prop"></g>
  <g id="fx"></g>
</svg>
